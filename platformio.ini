[platformio]
src_dir = src
default_envs = crowpanel_p4

[env:crowpanel_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	lvgl/lvgl@9.1.0
	moononournation/GFX Library for Arduino@1.6.9
	miguelbalboa/MFRC522@^1.4.12
	bitbank2/JPEGDEC@1.8.4
	jgromes/RadioLib@7.8.1
	mikalhart/TinyGPSPlus@1.0.3
	robtillaart/INA226@0.6.6
	symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi
build_flags =
	-D LV_CONF_SKIP
	-D LV_KCONFIG_IGNORE
	-D LV_COLOR_DEPTH=16
	-D LV_MEM_SIZE=196608
	-D LV_USE_LOG=1
	-D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_FONT_MONTSERRAT_24=1
	-I./include
