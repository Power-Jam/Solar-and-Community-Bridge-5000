[platformio]
src_dir = src
; Pictures for the flash: `pio run -t uploadfs` puts this folder on the board (see partitions.csv).
data_dir = sd
default_envs = crowpanel_p4

[env:crowpanel_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	lvgl/lvgl@9.5.0
	moononournation/GFX Library for Arduino@1.6.9
	miguelbalboa/MFRC522@^1.4.12
	bitbank2/JPEGDEC@1.8.4
	jgromes/RadioLib@7.8.1
	mikalhart/TinyGPSPlus@1.0.3
	robtillaart/INA226@0.6.6
	symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi
build_flags =
	; Pictures from the board's flash (0) or from an SD card (1); both are mounted at /sdcard.
	-D ASSETS_ON_SD_CARD=0
	; Developer mode: 1 = after loading, show the dashboard (sensors, WiFi, LoRa);
	; 0 = go straight to the app screens, without the dashboard.
	-D DEVELOPER_MODE=1
	-D LV_CONF_SKIP
	-D LV_KCONFIG_IGNORE
	-D LV_COLOR_DEPTH=16
	-D LV_MEM_SIZE=1048576
	; LVGL's heap lives in PSRAM: internal RAM is needed for DMA (SD card, WiFi).
	-D LV_MEM_POOL_INCLUDE=\"esp32-hal-psram.h\"
	-D LV_MEM_POOL_ALLOC=ps_malloc
	-D LV_USE_LOG=1
	-D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
	-D LV_FONT_MONTSERRAT_16=1
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_FONT_MONTSERRAT_24=1
	-D LV_FONT_MONTSERRAT_28=1
	-D LV_FONT_MONTSERRAT_48=1
	-D LV_USE_FS_POSIX=1
	-D LV_FS_POSIX_LETTER=83
	-D LV_FS_POSIX_PATH=\"/sdcard\"
	-D LV_USE_TJPGD=1
	-I./include
